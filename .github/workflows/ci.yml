name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSVC + Qt6)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: pip install clang-format==22.1.3

      # aqtinstall provides prebuilt Qt 6.8 for MSVC — no Conan, so no
      # hours-long Qt-from-source build on cache misses. Sets Qt6_DIR and
      # adds Qt to PATH.
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"

      # Ninja generator requires cl.exe on PATH; the VS generator locates the
      # toolset itself. This sets up the MSVC environment for the whole job.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build/Release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/Release

      - name: Format check
        run: cmake --build build/Release --target clang-format-check

      - name: Test
        run: ctest --test-dir build/Release --output-on-failure

  ubuntu:
    name: Ubuntu (GCC + Qt6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libpq5

      - name: Install clang-format
        run: pip install clang-format==22.1.3

      # aqtinstall provides prebuilt Qt 6.8 (ubuntu-latest's apt Qt is too old
      # for find_package(Qt6 6.8)). Sets Qt6_DIR and adds Qt to PATH.
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: "linux"
          target: "desktop"
          arch: "linux_gcc_64"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Format check
        run: cmake --build build --target clang-format-check

      - name: Test
        run: ctest --test-dir build --output-on-failure
